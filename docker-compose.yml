services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esavi_app_v2
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://esavi_user:esavi_password@10.0.0.3:5432/esavi_db}
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
